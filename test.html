<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>カフェのホームページ</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

<header>
    <h1>TNG CAFE</h1>
    <h4>心安らぐ一杯をあなたに</h4>
    <nav>
        <ul>
            <li><a href="#section1">About Us</a></li>
            <li><a href="#section2">Menu</a></li>
            <li><a href="#section3">Contact</a></li>
        </ul>
    </nav>
</header>


<main>
    <section id="section1">
        <h2>About Us</h2>
        <h3>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>
        自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</h3>
    </section>
        
    <section id="section2">
        <h2>Menu</h2>
        <img src="ブレンドコーヒー.jpg" alt="ブレンドコーヒー">
        <img src="ベイクドチーズケーキ.jpg" alt="ベイクドチーズケーキ">
        <img src="カフェラテ.jpg" alt="カフェラテ">
    </section>
    
    <section id="section3">
        <h2>Contact</h2>
        <form action="#" method="post">
            <label for="name">お名前：</label>
            <input type="text" id="name" name="name">
            <label for="email">メールアドレス：</label>
            <input type="email" id="email" name="email">
            <label for="inquiry">お問い合わせ内容：</label>
            <textarea id="inquiry" name="inquiry" rows="4" cols="40"></textarea>
            <button type="submit">送信</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 TNG Cafe</p>
</footer>

</body>
</html>
